<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRT TEAMWORK BATTLE</title>
<style>body{margin:0;background:#07151c;color:white;font-family:Arial,Tahoma}main{max-width:600px;margin:auto;padding:16px}h1{text-align:center;color:#ffc928}.card{background:#15303b;padding:18px;border-radius:18px;margin:12px 0}button,input{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;font-size:18px}button{background:#168442;color:white;font-weight:bold}.hide{display:none}.stats{display:flex;gap:8px}.stats div{flex:1;background:#091a22;padding:10px;text-align:center;border-radius:10px}.arena{height:360px;position:relative;overflow:hidden;background:#29434d;border-radius:16px}.p{position:absolute;bottom:10px;font-size:50px}.o{position:absolute;font-size:38px}.ctrl{display:flex;gap:8px}.q button{background:#294d5b;text-align:left}.boss{text-align:center;font-size:90px}.bar{height:25px;background:#333;border-radius:20px;overflow:hidden}.hp{height:100%;background:#d84231}.msg{text-align:center;color:#ffd42b;font-weight:bold;min-height:28px}</style>
<main><h1>⚡ NRT TEAMWORK BATTLE</h1><p style="text-align:center">กู้โรงงาน • แข่งคะแนน • TEAMWORK</p>
<section id="s" class="card"><div style="font-size:60px;text-align:center">🏭🏃</div><p>วิ่งเก็บอุปกรณ์ → เจอสถานการณ์ → ซ่อมเครื่อง → BOSS</p><input id="n" placeholder="ชื่อผู้เล่น"><button onclick="start()">▶ เริ่มเกม</button></section>
<section id="g" class="hide"><div class="stats"><div>คะแนน<br><b id="sc">0</b></div><div>COMBO<br><b id="co">x0</b></div><div>ด่าน<br><b id="st">1</b></div></div><div id="m" class="msg"></div><div id="c"></div></section>
<section id="e" class="card hide" style="text-align:center"><div style="font-size:60px">🏆</div><h1>MISSION COMPLETE!</h1><h2 id="fin"></h2><p>ร่วมมือ • ช่วยเหลือ • สื่อสาร • ไม่โทษกัน</p><button onclick="location.reload()">เล่นอีกครั้ง</button></section></main>
<script>
var score=0,combo=0,x=45,got=0,spawn;
function u(){sc.textContent=score;co.textContent="x"+combo}
function start(){s.className="hide";g.className="";run()}
function move(d){x=Math.max(0,Math.min(88,x+d*18));document.getElementById("p").style.left=x+"%"}
function run(){st.textContent="1";c.innerHTML='<div class="card"><h3>🏃 วิ่งเก็บ 🔧 ⭐ และหลบ 📦</h3><div id="a" class="arena"><div id="p" class="p">🏃</div></div><div class="ctrl"><button onclick="move(-1)">⬅️</button><button onclick="move(1)">➡️</button></div></div>';p.style.left=x+"%";spawn=setInterval(function(){var good=Math.random()<.72,o=document.createElement("div");o.className="o";o.textContent=good?(Math.random()<.5?"🔧":"⭐"):"📦";o.style.left=Math.random()*88+"%";o.style.top="0";a.appendChild(o);var y=0,t=setInterval(function(){y+=14;o.style.top=y+"px";if(y>290){if(Math.abs(parseFloat(o.style.left)-parseFloat(p.style.left))<13){if(good){got++;combo++;score+=100+combo*10;m.textContent="🔥 COMBO x"+combo}else{combo=0;score=Math.max(0,score-100);m.textContent="💥 หลบให้ดี!"}u()}o.remove();clearInterval(t);if(got>=7){clearInterval(spawn);quiz()}},75)},650)}
function quiz(){st.textContent="2";c.innerHTML='<div class="card q"><h2>🚨 เพื่อนต่างแผนกต้องการความช่วยเหลือ!</h2><p>คุณจะทำอย่างไร?</p><button onclick="ans(1)">🤝 เข้าไปช่วยและประสานทีม</button><button onclick="ans(0)">👉 บอกว่าไม่ใช่งานเรา</button><button onclick="ans(0)">🏃 เดินผ่านไป</button></div>'}
function ans(ok){if(ok){score+=500;m.textContent="✅ TEAMWORK +500"}else{score=Math.max(0,score-150);m.textContent="❌ ไม่โยนปัญหาให้กัน"}u();setTimeout(repair,600)}
function repair(){st.textContent="3";window.pos=0;c.innerHTML='<div class="card"><h2>🔧 ซ่อมเครื่องจักร</h2><p>กดตามลำดับ 💬 → 🤝 → 🔧 → ✅</p><button onclick="part(this,0)">💬 สื่อสาร</button><button onclick="part(this,1)">🤝 ขอความช่วยเหลือ</button><button onclick="part(this,2)">🔧 ซ่อม</button><button onclick="part(this,3)">✅ ตรวจสอบ</button></div>'}
function part(b,i){if(i===pos){pos++;score+=200;b.disabled=true;m.textContent="PERFECT! "+pos+"/4"}else{score=Math.max(0,score-100);m.textContent="ผิดลำดับ!"}u();if(pos===4)setTimeout(boss,500)}
function boss(){st.textContent="BOSS";window.hp=100;c.innerHTML='<div class="card"><h2>🤖 BOSS BATTLE!</h2><div class="boss">🤖</div><div class="bar"><div id="h" class="hp" style="width:100%"></div></div><p>รวมพลังให้เครื่องจักรกลับมาทำงาน!</p><button id="hit" onclick="attack()">🤝 รวมพลัง!</button></div>'}
function attack(){hp-=10;score+=100;h.style.width=hp+"%";m.textContent="🔥 TEAM POWER!";u();if(hp<=0){hit.disabled=true;score+=1000;setTimeout(done,500)}}
function done(){g.className="hide";e.className="card";fin.textContent=(n.value||"NRT Player")+" — "+score+" คะแนน"}u()
</script>
