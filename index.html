<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NRT TEAMWORK DRAW - Multiplayer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1720;color:#fff;font-family:Tahoma,Arial,sans-serif}
main{max-width:680px;margin:auto;padding:14px}.card{background:#17313d;border:1px solid #486a78;border-radius:18px;padding:18px;margin:12px 0}
h1{text-align:center;color:#ffd12a;margin:6px 0}.sub{text-align:center;color:#cfe2ea}
button,input{width:100%;padding:14px;border:0;border-radius:12px;margin:6px 0;font-size:17px}
button{background:#168347;color:white;font-weight:800;cursor:pointer}.secondary{background:#2f5968}.danger{background:#8e2c28}
.hidden{display:none!important}.big{text-align:center;font-size:54px}.roomcode{text-align:center;font-size:36px;color:#ffd12a;font-weight:900;letter-spacing:4px}
.player{padding:10px 12px;border-radius:12px;background:#10252e;margin:6px 0;display:flex;justify-content:space-between}
.me{outline:2px solid #ffd12a}.host{color:#ffd12a}.status{text-align:center;color:#ffd12a;font-weight:800;min-height:28px}
canvas{display:block;width:100%;height:360px;background:#fff;border-radius:16px;touch-action:none}.row{display:flex;gap:8px}.row>*{flex:1}
.timer{text-align:center;font-size:38px;font-weight:900;color:#ffd12a}.prompt{background:#3b2750;padding:14px;border-radius:13px;text-align:center;font-size:20px}
.finalimg{width:100%;border-radius:15px;background:white}.choice{text-align:left;background:#2d5260}
.small{font-size:13px;color:#bdd0d8;text-align:center}
</style>
</head>
<body><main>
<h1>🎨 NRT TEAMWORK DRAW</h1>
<div class="sub">Multiplayer • ห้องละ 6 คน • วาดต่อกันคนละ 15 วินาที</div>

<section id="home" class="card">
  <div class="big">📱📱📱 🤝</div>
  <input id="name" placeholder="ชื่อผู้เล่น">
  <button id="createBtn">👑 สร้างห้องใหม่</button>
  <div class="row">
    <input id="joinCode" maxlength="6" placeholder="รหัสห้อง">
    <button id="joinBtn" class="secondary">เข้าห้อง</button>
  </div>
  <div id="homeMsg" class="status"></div>
</section>

<section id="lobby" class="card hidden">
  <h2 style="text-align:center">ห้องของทีม</h2>
  <div id="roomCode" class="roomcode"></div>
  <div class="small">ให้เพื่อนเปิดลิงก์เดียวกัน แล้วใส่รหัสนี้</div>
  <div id="players"></div>
  <div id="lobbyMsg" class="status"></div>
  <button id="startGameBtn" class="hidden">▶ เริ่มเกมเมื่อครบ 6 คน</button>
  <button id="leaveBtn" class="danger">ออกจากห้อง</button>
</section>

<section id="waitTurn" class="card hidden">
  <div class="big">⏳</div>
  <h2 id="waitTitle" style="text-align:center"></h2>
  <div id="waitMsg" class="status"></div>
</section>

<section id="drawScreen" class="hidden">
  <div class="card">
    <div id="turnLabel" style="font-weight:800"></div>
    <div id="promptBox" class="prompt hidden"></div>
    <div class="timer">⏱ <span id="timer">15</span></div>
    <div id="drawMsg" class="status"></div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="row">
    <button id="clearBtn" class="secondary">🧽 ล้าง</button>
    <button id="submitBtn">🔔 ส่งต่อ</button>
  </div>
</section>

<section id="guessScreen" class="card hidden">
  <h2>😂 ภาพสุดท้ายคืออะไร?</h2>
  <img id="finalImage" class="finalimg">
  <div id="guessChoices"></div>
  <div id="guessMsg" class="status"></div>
</section>

<section id="endScreen" class="card hidden">
  <div class="big">🏆</div>
  <h1>TEAMWORK COMPLETE!</h1>
  <div id="endText" class="status"></div>
  <p style="text-align:center">🤝 สามัคคี • 👥 ช่วยเหลือข้ามทีม • ❤️ ไม่โทษกันไปมา</p>
  <button id="restartBtn">กลับห้องรอ</button>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4wbNF3-dE_YtdCBC4XmCzvuP7IBZ-kxQ",
  authDomain: "nrt-teamwork-game.firebaseapp.com",
  databaseURL: "https://nrt-teamwork-game-default-rtdb.firebaseio.com",
  projectId: "nrt-teamwork-game",
  storageBucket: "nrt-teamwork-game.firebasestorage.app",
  messagingSenderId: "216090591382",
  appId: "1:216090591382:web:73ad2766eba3a5b6bd7ab7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const prompts = [
 {q:"พนักงานช่วยกันซ่อมเครื่องจักร",o:["พนักงานช่วยกันซ่อมเครื่องจักร","พนักงานกำลังกินข้าว","รถยกกำลังขนของ"]},
 {q:"เพื่อนต่างแผนกช่วยกันยกกล่องใหญ่",o:["เพื่อนต่างแผนกช่วยกันยกกล่องใหญ่","หัวหน้ากำลังประชุม","คนกำลังเล่นฟุตบอล"]},
 {q:"ทีมงานช่วยกันแก้เหตุฉุกเฉินในโรงงาน",o:["ทีมงานช่วยกันแก้เหตุฉุกเฉินในโรงงาน","พนักงานกำลังถ่ายรูป","คนกำลังพักกลางวัน"]}
];

let room="", myId=localStorage.getItem("nrt_uid") || crypto.randomUUID();
localStorage.setItem("nrt_uid",myId);
let meName="", roomData=null, unsub=null, turnTimer=null, left=15;
let drawing=false,lastX=0,lastY=0;

const $=id=>document.getElementById(id);
function show(id){["home","lobby","waitTurn","drawScreen","guessScreen","endScreen"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function playersArray(data){return data?.players ? Object.values(data.players).sort((a,b)=>a.seat-b.seat) : []}

async function createRoom(){
 meName=$("name").value.trim(); if(!meName){$("homeMsg").textContent="กรุณาใส่ชื่อ";return}
 room=code();
 const p={id:myId,name:meName,seat:1,host:true};
 await set(ref(db,"rooms/"+room),{status:"lobby",createdAt:Date.now(),hostId:myId,players:{[myId]:p}});
 enterRoom();
}
async function joinRoom(){
 meName=$("name").value.trim(); room=$("joinCode").value.trim().toUpperCase();
 if(!meName||!room){$("homeMsg").textContent="ใส่ชื่อและรหัสห้อง";return}
 const snap=await get(ref(db,"rooms/"+room)); if(!snap.exists()){$("homeMsg").textContent="ไม่พบห้อง";return}
 const data=snap.val(), arr=playersArray(data);
 if(arr.length>=6){$("homeMsg").textContent="ห้องเต็ม 6 คนแล้ว";return}
 if(data.status!=="lobby"){$("homeMsg").textContent="เกมเริ่มแล้ว เข้าห้องไม่ได้";return}
 const seat=Math.max(0,...arr.map(p=>p.seat))+1;
 await set(ref(db,`rooms/${room}/players/${myId}`),{id:myId,name:meName,seat,host:false});
 enterRoom();
}
function enterRoom(){
 show("lobby"); $("roomCode").textContent=room;
 if(unsub)unsub();
 unsub=onValue(ref(db,"rooms/"+room),snap=>{
   if(!snap.exists()){show("home");$("homeMsg").textContent="ห้องถูกปิด";return}
   roomData=snap.val(); renderState();
 });
}
function renderState(){
 const arr=playersArray(roomData), me=roomData.players?.[myId];
 if(roomData.status==="lobby"){
   show("lobby"); $("roomCode").textContent=room;
   $("players").innerHTML=arr.map(p=>`<div class="player ${p.id===myId?"me":""}"><span>${p.seat}. ${p.name}</span><span>${p.host?"👑 HOST":""}</span></div>`).join("");
   $("lobbyMsg").textContent=`ผู้เล่น ${arr.length}/6`;
   if(me?.host){$("startGameBtn").classList.remove("hidden");$("startGameBtn").disabled=arr.length!==6}
   else $("startGameBtn").classList.add("hidden");
 } else if(roomData.status==="playing"){
   const turn=roomData.turn||1;
   if(me?.seat===turn) startMyTurn();
   else {show("waitTurn");$("waitTitle").textContent=`รอคนวาด ${turn}/6`;$("waitMsg").textContent="รูปจะส่งต่อมาถึงคุณอัตโนมัติ";}
 } else if(roomData.status==="guess"){
   renderGuess();
 } else if(roomData.status==="finished"){
   show("endScreen");$("endText").textContent=roomData.result||"จบเกม!";
 }
}
async function startGame(){
 const pick=prompts[Math.floor(Math.random()*prompts.length)];
 await update(ref(db,"rooms/"+room),{status:"playing",turn:1,prompt:pick.q,choices:pick.o,image:"",submitted:false});
}
function startMyTurn(){
 if($("drawScreen").dataset.turn===String(roomData.turn))return;
 $("drawScreen").dataset.turn=String(roomData.turn);
 show("drawScreen"); $("turnLabel").textContent=`✏️ คุณคือคนวาด ${roomData.turn}/6`;
 $("promptBox").classList.toggle("hidden",roomData.turn!==1);
 if(roomData.turn===1)$("promptBox").textContent="🎯 "+roomData.prompt;
 $("drawMsg").textContent=roomData.turn>1?"วาดต่อจากรูปเพื่อน ห้ามลบของเพื่อน!":"จำโจทย์แล้วเริ่มวาดได้เลย";
 prepareCanvas(roomData.image);
 clearInterval(turnTimer);left=15;$("timer").textContent=left;
 turnTimer=setInterval(()=>{left--;$("timer").textContent=left;if(left<=0)submitTurn()},1000);
}
function prepareCanvas(img){
 const cv=$("canvas"), r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=360;
 const ctx=cv.getContext("2d"); ctx.lineWidth=5;ctx.lineCap="round";ctx.strokeStyle="#111";
 ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
 if(img){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=img}
}
function xy(ev){const r=$("canvas").getBoundingClientRect(),p=ev.touches?ev.touches[0]:ev;return[p.clientX-r.left,p.clientY-r.top]}
function down(ev){ev.preventDefault();drawing=true;[lastX,lastY]=xy(ev)}
function move(ev){if(!drawing)return;ev.preventDefault();let [x,y]=xy(ev),ctx=$("canvas").getContext("2d");ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();lastX=x;lastY=y}
function up(){drawing=false}
["mousedown","touchstart"].forEach(x=>$("canvas").addEventListener(x,down,{passive:false}));
["mousemove","touchmove"].forEach(x=>$("canvas").addEventListener(x,move,{passive:false}));
["mouseup","mouseleave","touchend"].forEach(x=>$("canvas").addEventListener(x,up));
async function submitTurn(){
 clearInterval(turnTimer);
 const image=$("canvas").toDataURL("image/jpeg",0.7);
 if(roomData.turn<6) await update(ref(db,"rooms/"+room),{image,turn:roomData.turn+1});
 else await update(ref(db,"rooms/"+room),{image,status:"guess"});
}
function renderGuess(){
 show("guessScreen");$("finalImage").src=roomData.image||"";
 $("guessChoices").innerHTML="";
 [...roomData.choices].sort(()=>Math.random()-.5).forEach(o=>{
   const b=document.createElement("button");b.className="choice";b.textContent=o;
   b.onclick=async()=>{
     const ok=o===roomData.prompt;
     $("guessMsg").textContent=ok?"🎉 ทายถูก! TEAMWORK สำเร็จ":"😆 ทายผิด แต่ภาพนี้ฮามาก!";
     await update(ref(db,"rooms/"+room),{status:"finished",result:ok?"🎉 ทีมทายถูก! 1,000 คะแนน":"😆 ทายผิด แต่ TEAMWORK ผ่าน!"});
   };$("guessChoices").appendChild(b)
 })
}
async function leaveRoom(){
 if(!room)return;
 const wasHost=roomData?.hostId===myId;
 await remove(ref(db,`rooms/${room}/players/${myId}`));
 if(wasHost) await remove(ref(db,"rooms/"+room));
 room=""; if(unsub)unsub(); show("home");
}
async function restart(){
 if(roomData.hostId===myId) await update(ref(db,"rooms/"+room),{status:"lobby",turn:null,image:"",result:null});
 else show("lobby");
}

$("createBtn").onclick=createRoom;$("joinBtn").onclick=joinRoom;$("startGameBtn").onclick=startGame;$("leaveBtn").onclick=leaveRoom;
$("submitBtn").onclick=submitTurn;$("clearBtn").onclick=()=>{if(roomData.turn===1)prepareCanvas("");else $("drawMsg").textContent="❌ ห้ามลบของเพื่อน!"};
$("restartBtn").onclick=restart;
</script>
</body></html>
